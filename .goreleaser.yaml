version: 2

project_name: agent-sync

before:
  hooks:
    - go mod tidy

builds:
  - id: agent-sync
    main: ./cmd/agent-sync
    binary: agent-sync
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: arm64

archives:
  - id: binary
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

brews:
  - name: agent-sync
    repository:
      owner: agent-sync
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/agent-sync/agent-sync"
    description: "Sync AI chat histories, extract context, build knowledge graphs, and hand off coherent snapshots between tools"
    license: "MIT"
    commit_author:
      name: agent-sync-bot
      email: bot@agent-sync.github
    test: |
      system "#{bin}/agent-sync --version"

nfpms:
  - id: packages
    package_name: agent-sync
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    vendor: agent-sync
    homepage: "https://github.com/agent-sync/agent-sync"
    description: "Sync AI chat histories, extract context, build knowledge graphs, and hand off coherent snapshots between tools"
    license: "MIT"
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin
    contents:
      - src: ./README.md
        dst: /usr/share/doc/agent-sync/README.md

release:
  prerelease: auto
  draft: true
